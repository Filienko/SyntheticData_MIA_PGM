# config.yaml — MAMA-MIA attack on Health-Privacy-Challenge, Track I Red Team
#
# Attack script: attack_submission.py
# This config documents the actual parameters used; attack_submission.py
# reads its parameters from CLI arguments, not this file directly.

# ------------------------------------------------------------------
# Competition repo paths
# ------------------------------------------------------------------
dir_list:
  home: "~/Health-Privacy-Challenge"
  data_splits: "data_splits"
  meta: "data/meta"
  processed_data: "data/processed"
  mia_files: "results/mia"

# ------------------------------------------------------------------
# Attack method
# ------------------------------------------------------------------
attack_model: "mama_mia_pgm"   # MAMA-MIA with Private-PGM focal points

# ------------------------------------------------------------------
# Blue Team generator being attacked
# ------------------------------------------------------------------
generator_config:
  name: "pgg_pgm"              # PPML-Huskies PRO-GENE-GEN Private PGM
  epsilon: 7.0                 # DP budget used by Blue Team
  iterations: 10000

# ------------------------------------------------------------------
# MAMA-MIA attack parameters (match these when running attack_submission.py)
# ------------------------------------------------------------------
mama_mia_pgm_config:
  n_bins: 4                    # matches PRO-GENE-GEN alpha=0.25 quantile scheme
                               # (Q25/Q50/Q75 boundaries → 4 bins)
  target_col: "cancer_type"    # 2-way (gene, cancer_type) focal points
  standardize: false           # no StandardScaler; PGM used quantile binning only

# ------------------------------------------------------------------
# Equivalent CLI command (TCGA-COMBINED)
# ------------------------------------------------------------------
# python3 attack_submission.py \
#     --submission-dir  submission/blueteam_PPML-Huskies_TCGA-COMBINED \
#     --tcga-dir        ~/privacy/Health-Privacy-Challenge/data/RED_TCGA-COMBINED \
#     --output-dir      results/ppml_huskies \
#     --target-col      cancer_type \
#     --n-bins          4

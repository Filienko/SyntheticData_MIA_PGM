# config.yaml  – MAMA-MIA Private-PGM attack
# Health-Privacy-Challenge, Track I Red Team submission
#
# Place this file in the directory you run red_team.py from
# (or pass the full path to open() inside red_team.py if preferred).
#
# Switch between TCGA-BRCA and TCGA-COMBINED by changing:
#   dataset_config.name
#   mama_mia_pgm_config.target_col
# -----------------------------------------------------------------------

# ------------------------------------------------------------------
# Paths  (adjust home: to your local clone of the competition repo)
# ------------------------------------------------------------------
dir_list:
  home:           "~/Health-Privacy-Challenge"
  data_splits:    "data_splits"
  meta:           "data/meta"
  processed_data: "data/processed"
  mia_files:      "results/mia"      # predictions are written here

# ------------------------------------------------------------------
# Dataset  – pick ONE block and comment out the other
# ------------------------------------------------------------------

## ---- TCGA-BRCA ----
# dataset_config:
#   name:                "TCGA-BRCA"
#   membership_label_col: "membership_label"

## ---- TCGA-COMBINED ----
dataset_config:
  name:                 "TCGA-COMBINED"
  membership_label_col: "membership_label"

# ------------------------------------------------------------------
# Which Blue Team generator to attack
# Change experiment_name to match the Blue Team's epsilon / config tag
# ------------------------------------------------------------------
generator_config:
  name:            "dp_pgm"          # Blue Team generator identifier
  experiment_name: "epsilon_7.0"     # adjust to the Blue Team's experiment

# ------------------------------------------------------------------
# Attack model  (must match the key in mia_classes in red_team.py)
# ------------------------------------------------------------------
attack_model: "mama_mia_pgm"

# ------------------------------------------------------------------
# MAMA-MIA attack parameters
# The key MUST be "{attack_model}_config" → "mama_mia_pgm_config"
# ------------------------------------------------------------------
mama_mia_pgm_config:

  # Quantile bins for discretizing continuous gene-expression values.
  # 4 matches PRO-GENE-GEN's alpha=0.25 scheme (Q25/Q50/Q75 boundaries).
  # Use 10 for higher resolution at the cost of sparser marginals.
  n_bins: 4

  # Column used for 2-way (gene, label) marginals.
  # TCGA-BRCA    → "Subtype"      (if the synthetic CSV includes it)
  # TCGA-COMBINED → "cancer_type" (if the synthetic CSV includes it)
  # ""           → 1-way marginals only (safest for ~1000-gene data)
  target_col: ""

  # Sigmoid centering percentile.
  # 50  = median centering (equal predicted member/non-member split).
  # 20  = 80 % of targets predicted as members (use for 80/20 train splits).
  centering_percentile: 50
